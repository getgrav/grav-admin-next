<!doctype html>
<!-- `lang` and `dir` are set on hydration from the user's i18n preference;
     see the $effect in src/routes/+layout.svelte. -->
<html data-theme="grav">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="data:," />
		<!-- All fonts are self-hosted; no external requests. Google Sans (default) is
		     declared in layout.css; alternate families are bundled via @fontsource-variable
		     imports in +layout.svelte. See getgrav/grav-plugin-admin2#97. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
